<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booksky</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="navbar">
        <h1>Bookfolio</h1>
    </div>
    <div class="container">
        <div class="book-container">
            <h2>You Are Born to Blossom</h2>
            <h5>Dr. A.P.J. Abdul Kalam</h5>
            <p> This motivational guide encourages readers to step beyond their self-imposed limitations and realize their unique talents. It views education as a lifelong process for personal growth and societal contribution. </p>
            <button type="button" onclick="deletebook(event)">Delete</button> 
        </div>
    </div>
    <div class="popup-overlay"></div>
    <div class="popup-box">
        <h2>ADD BOOK</h2>
        <form>
            <input type="text" placeholder="book title" id="book-title-input">
            <input type="text" placeholder="book author" id="book-author-input">
            <textarea placeholder="short description" id="book-description-input"></textarea>
            <button type="button" id="add-book">ADD</button>
            <button type="button" id="cancel-popup-btn">CANCEL</button>
        </form>
    </div>
    <button class="add-button" id="add-popup-button">+</button>
    <script src="script.js"></script>
</body>
</html>
